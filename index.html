<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>† 𝕯𝖊𝖛𝖎𝖑 ! — Digital Space</title>
<meta name="description" content="Welcome to my digital space. Connect with me on Discord and Instagram.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/jpeg" href="https://file.garden/ameA3cFLEklTDhiW/devil_avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --glass-bg:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.08);
  --glass-shadow:rgba(0,0,0,0.8);
  --text-primary:#ffffff;
  --text-secondary:rgba(255,255,255,0.5);
  --text-muted:rgba(255,255,255,0.25);
  --accent:#ffffff;
  --blur-amount:40px;
  --radius:28px;
  --radius-sm:16px;
  --transition:0.6s cubic-bezier(0.22,1,0.36,1);
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:'Inter','SF Pro Display','Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#000;
  color:var(--text-primary);
  overflow-x:hidden;
  cursor:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
::selection{background:rgba(255,255,255,0.2);color:#fff}

/* Enter / Loading Screen (guns.lol style) */
#loader{
  position:fixed;inset:0;z-index:99999;
  background:rgba(5,5,8,0.92);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:opacity 0.6s cubic-bezier(0.16,1,0.3,1),visibility 0.6s cubic-bezier(0.16,1,0.3,1),transform 0.6s cubic-bezier(0.16,1,0.3,1);
}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.04)}
.enter-content{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;
  animation:enterFade 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes enterFade{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.enter-badge{
  width:92px;height:92px;border-radius:50%;padding:2.5px;
  background:linear-gradient(135deg,#ffffff 0%,#8696a8 40%,#ffffff 70%,#1c212a 100%);
  box-shadow:0 0 30px rgba(255,255,255,0.4),0 0 60px rgba(255,40,60,0.35);
  animation:enterPulse 3s ease-in-out infinite;
  overflow:hidden;
}
@keyframes enterPulse{
  0%,100%{box-shadow:0 0 25px rgba(255,255,255,0.3),0 0 50px rgba(255,40,60,0.3)}
  50%{box-shadow:0 0 45px rgba(255,255,255,0.6),0 0 85px rgba(255,40,60,0.5)}
}
.enter-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.enter-title{
  font-family:'UnifrakturMaguntia','Cinzel',serif;
  font-size:46px;font-weight:700;letter-spacing:3px;color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,0.8),0 0 40px rgba(255,40,60,0.6);
  margin:0;line-height:1.1;
}
.enter-prompt{
  font-size:13px;font-weight:500;letter-spacing:3.5px;text-transform:lowercase;
  color:rgba(255,255,255,0.85);
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 18px;border-radius:24px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  animation:promptBlink 2.2s ease-in-out infinite;
}
@keyframes promptBlink{
  0%,100%{opacity:0.95;text-shadow:0 0 12px rgba(255,255,255,0.6);transform:scale(1)}
  50%{opacity:0.5;text-shadow:none;transform:scale(0.98)}
}

/* Video Background */
.video-container{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
  background:#000;
}
.video-container video{
  position:absolute;min-width:100%;min-height:100%;
  width:100%;height:100%;
  object-fit:cover;
  will-change:transform;
  transition:opacity 0.4s ease;
}
.video-overlay{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.3) 50%,rgba(0,0,0,0.7) 100%);
  z-index:1;
}
.grain-overlay{
  position:fixed;inset:0;z-index:2;
  opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  pointer-events:none;
}
.halftone-overlay{
  position:fixed;inset:0;z-index:2;
  pointer-events:none;
  opacity:0.32;
  background-image:radial-gradient(circle, rgba(0,0,0,0.85) 1.2px, transparent 1.2px);
  background-size:3.5px 3.5px;
}

/* Particles Canvas */
#particles-canvas{position:fixed;inset:0;z-index:3;pointer-events:none}

/* Modern Tactical Razor Cursor */
.custom-cursor-wrap{
  position:fixed;
  top:0;left:0;
  pointer-events:none;
  z-index:99999;
  opacity:0;
  transition:opacity 0.25s ease;
  will-change:transform;
}
.custom-cursor-wrap .cursor-svg{
  display:block;
  width:22px;
  height:22px;
  overflow:visible;
  transition:transform 0.18s cubic-bezier(0.22,1,0.36,1), filter 0.25s ease;
  transform-origin:0 0;
}
.custom-cursor-wrap.hover .cursor-svg{
  transform:scale(1.18);
  filter:drop-shadow(0 0 10px rgba(255,45,85,0.75)) drop-shadow(0 2px 6px rgba(0,0,0,0.9));
}
.custom-cursor-wrap.hover .cursor-blade-main{
  stroke:#ff2d55;
  stroke-width:1.5;
}
.custom-cursor-wrap.hover .cursor-blade-core{
  r:2;
  box-shadow:0 0 8px #ff2d55;
}
.cursor-follower{
  position:fixed;
  top:0;left:0;
  width:16px;
  height:16px;
  border-radius:50%;
  border:1.2px solid rgba(255,255,255,0.45);
  background:rgba(255,255,255,0.02);
  pointer-events:none;
  z-index:99998;
  opacity:0;
  transition:width 0.25s cubic-bezier(0.22,1,0.36,1),
             height 0.25s cubic-bezier(0.22,1,0.36,1),
             border-color 0.25s ease,
             background 0.25s ease,
             box-shadow 0.25s ease,
             opacity 0.25s ease;
  will-change:transform;
}
.cursor-follower::after{
  content:'';
  position:absolute;
  top:50%;left:50%;
  width:3px;
  height:3px;
  border-radius:50%;
  background:rgba(255,255,255,0.75);
  transform:translate(-50%,-50%);
  transition:all 0.25s ease;
}
.cursor-follower.hover{
  width:36px;
  height:36px;
  border-color:rgba(255,45,85,0.8);
  background:rgba(255,45,85,0.06);
  box-shadow:0 0 16px rgba(255,45,85,0.35);
}
.cursor-follower.hover::after{
  background:#ff2d55;
  width:5px;
  height:5px;
  box-shadow:0 0 8px #ff2d55;
}
.cursor-follower.clicking{
  transform:scale(0.65) !important;
  border-color:#ffffff;
}
.click-shockwave{
  position:fixed;
  top:0;left:0;
  width:8px;
  height:8px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.9);
  box-shadow:0 0 12px rgba(255,45,85,0.7);
  pointer-events:none;
  z-index:99997;
  transform:translate(-50%,-50%) scale(1);
  animation:shockwaveAnim 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
}
@keyframes shockwaveAnim{
  0%{transform:translate(-50%,-50%) scale(1);opacity:1;border-color:#ffffff}
  100%{transform:translate(-50%,-50%) scale(5.2);opacity:0;border-color:rgba(255,45,85,0)}
}

/* Spotlight */
.spotlight{
  position:fixed;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);
  pointer-events:none;z-index:4;
  transform:translate(-50%,-50%);
  will-change:transform,opacity;
  opacity:0;
  transition:opacity 0.8s ease;
}

/* Music Visualizer */
.visualizer-container{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;align-items:flex-end;gap:3px;
  height:32px;opacity:0.4;
  pointer-events:none;
}
.visualizer-container .bar{
  width:3px;border-radius:2px;
  background:linear-gradient(to top,transparent,rgba(255,255,255,0.6));
  transition:height 0.08s ease;
  will-change:height;
}

/* Sound Button */
.sound-btn{
  position:fixed;bottom:32px;right:32px;z-index:50;
  width:48px;height:48px;border-radius:50%;
  background:var(--glass-bg);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;cursor:none;
  transition:all var(--transition);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.sound-btn:hover{
  background:rgba(255,255,255,0.1);
  transform:scale(1.08);
  border-color:rgba(255,255,255,0.2);
}
.volume-slider-container{
  position:fixed;bottom:92px;right:32px;z-index:50;
  opacity:0;visibility:hidden;
  transition:all var(--transition);
  transform:translateY(8px);
}
.volume-slider-container.visible{opacity:1;visibility:visible;transform:translateY(0)}
.volume-slider-container input[type="range"]{
  -webkit-appearance:none;appearance:none;
  width:120px;height:3px;border-radius:2px;
  background:rgba(255,255,255,0.15);
  outline:none;display:block;
  cursor:none;
}
.volume-slider-container input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #000;
  cursor:none;
}
.volume-slider-container input[type="range"]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #000;cursor:none;
}

/* Navigation */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:20px 48px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,transparent 100%);
  opacity:0;transform:translateY(-20px);
  animation:navFadeIn 1s ease 0.8s forwards;
}
@keyframes navFadeIn{to{opacity:1;transform:translateY(0)}}
.nav-logo{
  font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:#fff;text-decoration:none;
  text-shadow:0 0 20px rgba(255,255,255,0.15),0 0 60px rgba(255,255,255,0.05);
  animation:logoGlow 3s ease-in-out infinite;
}
@keyframes logoGlow{0%,100%{text-shadow:0 0 20px rgba(255,255,255,0.15),0 0 60px rgba(255,255,255,0.05)}50%{text-shadow:0 0 30px rgba(255,255,255,0.3),0 0 80px rgba(255,255,255,0.08),0 0 120px rgba(255,255,255,0.03)}}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{
  color:var(--text-secondary);text-decoration:none;
  font-size:13px;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;
  position:relative;padding:4px 0;
  transition:color var(--transition);
  cursor:none;
}
.nav-links a::after{
  content:'';position:absolute;bottom:0;left:0;width:0;height:1px;
  background:#fff;transition:width var(--transition);
}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{width:100%}

/* Hero Section */
.hero{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:120px 24px 80px;
  text-align:center;
}
.hero::before{
  content:'';position:absolute;top:50%;left:50%;width:60vmin;height:60vmin;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,0.015) 0%,transparent 70%);
  pointer-events:none;z-index:-1;
}

/* Transparent Profile Container (guns.lol transparent aesthetic) */
.glass-card{
  width:100%;
  max-width:440px;
  padding:20px 12px;
  background:transparent !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  border:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
  position:relative;
  opacity:0;
  animation:cardReveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  transform-style:preserve-3d;
  will-change:transform;
}
@keyframes cardReveal{to{opacity:1}}
.glass-card::before,
.glass-card::after,
.card-ring,
.card-glare,
.card-toggle,
.mini-brand{
  display:none !important;
}

/* Empty state for deleted elements */

/* Mini Clock (Indian Standard Time) */
.mini-clock{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:50;
  font-size:12.5px;font-weight:400;letter-spacing:2.5px;color:rgba(255,255,255,0.45);
  font-variant-numeric:tabular-nums;pointer-events:none;
  text-shadow:0 0 12px rgba(0,0,0,0.8);
  opacity:0;animation:fadeIn 1s ease 1.5s forwards;
}
@keyframes fadeIn{to{opacity:1}}

@media(max-width:768px){
  .mini-clock{font-size:11px;letter-spacing:2px;top:56px}
}

/* Card Toggle */
.card-toggle{
  position:absolute;top:16px;right:16px;z-index:5;
  width:32px;height:32px;border-radius:8px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  cursor:none;transition:all var(--transition);
}
.card-toggle:hover{
  background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.6);
  border-color:rgba(255,255,255,0.08);
}
.card-toggle svg{transition:transform 0.4s ease}
.glass-card.minimized .card-toggle svg{transform:rotate(45deg)}
.glass-card.minimized .profile-header,
.glass-card.minimized .badges-row,
.glass-card.minimized .social-icons-center,
.glass-card.minimized .music-card,
.glass-card.minimized .bio-quote-section{display:none}
.glass-card.minimized{max-width:180px;padding:16px 20px;cursor:pointer;overflow:hidden;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:rgba(255,255,255,0.03);box-shadow:none}
.glass-card.minimized .card-ring{opacity:0}
.glass-card.minimized .card-toggle{top:50%;right:10px;transform:translateY(-50%)}
.glass-card.minimized::before,.glass-card.minimized::after{display:none}

.mini-brand{
  font-family:'UnifrakturMaguntia','Cinzel',serif;
  font-size:16px;font-weight:700;letter-spacing:2px;
  color:rgba(255,255,255,0.8);text-align:center;
  display:none;
}
.glass-card.minimized .mini-brand{
  display:block;
  color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,0.4),0 0 40px rgba(255,40,60,0.3);
  animation:minBrandGlow 3s ease-in-out infinite;
}
@keyframes minBrandGlow{0%,100%{text-shadow:0 0 20px rgba(255,255,255,0.3),0 0 40px rgba(255,40,60,0.2)}50%{text-shadow:0 0 35px rgba(255,255,255,0.7),0 0 60px rgba(255,40,60,0.5)}}

/* Profile Header (guns.lol aesthetic) */
.profile-header{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:24px;
  position:relative;
  z-index:2;
  transform-style:preserve-3d;
}
/* Profile Header (guns.lol transparent aesthetic) */
.profile-header{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:16px;
  position:relative;
  z-index:2;
  transform-style:preserve-3d;
}
.avatar-box{
  position:relative;
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  transform-style:preserve-3d;
  transform:translateZ(28px);
}
.avatar-wings{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:290px;
  height:145px;
  pointer-events:none;
  z-index:1;
  filter:drop-shadow(0 0 10px rgba(0,0,0,0.95)) drop-shadow(0 0 20px rgba(255,255,255,0.4));
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
}
.avatar-box:hover .avatar-wings{
  transform:translate(-50%,-50%) scale(1.08);
}
.avatar-pfp{
  position:relative;
  z-index:2;
  width:88px;
  height:88px;
  border-radius:50%;
  padding:2px;
  background:#090b10;
  border:2px solid rgba(255,255,255,0.35);
  box-shadow:0 0 30px rgba(0,0,0,0.9),0 0 15px rgba(255,255,255,0.3);
  overflow:hidden;
}
.avatar-img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  user-select:none;
  pointer-events:none;
}

/* Name with Sparkling Stars */
.name-wrapper{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:6px;
  transform-style:preserve-3d;
  transform:translateZ(24px);
}
.profile-name{
  font-family:'UnifrakturMaguntia','Cinzel','Georgia',serif;
  font-size:42px;
  font-weight:700;
  letter-spacing:4px;
  color:#ffffff;
  text-shadow:0 0 14px rgba(255,255,255,0.85),0 0 35px rgba(255,255,255,0.45),0 0 60px rgba(255,40,60,0.35);
  margin:0 8px;
  line-height:1.1;
  user-select:none;
  transition:all 0.3s ease;
}
.profile-name:hover{
  transform:scale(1.04);
  text-shadow:0 0 22px rgba(255,255,255,0.95),0 0 50px rgba(255,40,60,0.7);
}
.sparkle{
  position:absolute;
  color:#ffffff;
  pointer-events:none;
  user-select:none;
  text-shadow:0 0 8px rgba(255,255,255,0.95),0 0 16px rgba(255,255,255,0.6);
  animation:sparkleTwinkle 2.4s ease-in-out infinite;
}
.sp-1{top:-8px;left:-22px;font-size:16px;animation-delay:0s}
.sp-2{top:16px;left:-16px;font-size:10px;animation-delay:0.7s}
.sp-3{top:-12px;left:2px;font-size:9px;animation-delay:1.4s}
.sp-4{top:-10px;right:-24px;font-size:16px;animation-delay:0.35s}
.sp-5{top:16px;right:-18px;font-size:10px;animation-delay:1.05s}
.sp-6{top:-14px;right:0px;font-size:9px;animation-delay:1.75s}
@keyframes sparkleTwinkle{
  0%,100%{opacity:0.25;transform:scale(0.8) rotate(0deg)}
  50%{opacity:1;transform:scale(1.25) rotate(20deg)}
}

/* Tagline & Location */
.profile-tagline{
  font-family:'Cinzel','Georgia',serif;
  font-size:16px;
  font-style:italic;
  font-weight:600;
  letter-spacing:1px;
  color:#ffffff;
  text-shadow:0 0 12px rgba(255,255,255,0.5);
  margin-bottom:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transform:translateZ(20px);
}
.profile-tagline .tibetan-symbol{
  font-style:normal;
  font-size:16px;
  margin-left:4px;
}
.profile-location{
  font-size:12.5px;
  font-weight:500;
  letter-spacing:0.8px;
  color:rgba(255,255,255,0.9);
  text-shadow:0 0 12px rgba(0,0,0,0.9);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom:12px;
  padding:4px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transform:translateZ(18px);
  cursor:pointer;
  transition:all 0.35s cubic-bezier(0.22,1,0.36,1);
  user-select:none;
}
.profile-location:hover,
.profile-location.is-flipped{
  background:rgba(255,255,255,0.08);
  border-color:rgba(255,255,255,0.22);
  box-shadow:0 4px 20px rgba(0,0,0,0.5), 0 0 14px rgba(255,255,255,0.12);
  transform:translateZ(24px) scale(1.04);
}
.loc-pin{
  display:inline-block;
  font-size:12.5px;
  transition:transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.profile-location:hover .loc-pin,

<script>
(function(){
'use strict';

/* ==================== BACKGROUND VIDEO & SOUND ==================== */
const bgVideo = document.getElementById('bgVideo');
const loader = document.getElementById('loader');
const soundBtn = document.getElementById('soundBtn');
const volumeRange = document.getElementById('volumeRange');
const volumeSlider = document.getElementById('volumeSlider');
const visualizer = document.getElementById('visualizer');
let isPlaying = false;

function hideLoader(){
  if(loader && !loader.classList.contains('hidden')){
    loader.classList.add('hidden');
    document.body.style.cursor = 'none';
  }
}

function updateSoundIcon(){
  const icon = document.getElementById('soundIcon');
  if(icon){
    if(isPlaying){
      icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
    }else{
      icon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    }
  }
  if(typeof updateMusicPlayerState === 'function'){
    updateMusicPlayerState();
  }
}

function unmuteAndPlaySound(){
  if(!bgVideo) return;
  const targetVol = parseFloat(volumeRange ? volumeRange.value : 0.7) || 0.7;
  bgVideo.muted = false;
  bgVideo.volume = targetVol;
  var p = bgVideo.play();
  if(p !== undefined){
    p.then(function(){
      isPlaying = true;
      if(soundBtn) soundBtn.style.opacity = '1';
      updateSoundIcon();
      hideLoader();
    }).catch(function(err){
      console.warn('Audio play waiting for interaction:', err);
    });
  }
}

function tryDirectSoundOnOpen(){
  if(!bgVideo) return;
  const targetVol = parseFloat(volumeRange ? volumeRange.value : 0.7) || 0.7;
  bgVideo.muted = false;
  bgVideo.volume = targetVol;
  var p = bgVideo.play();
  if(p !== undefined){
    p.then(function(){
      isPlaying = true;
      if(soundBtn) soundBtn.style.opacity = '1';
      updateSoundIcon();
      hideLoader();
    }).catch(function(){
      // Browser blocked unmuted autoplay, play muted while waiting for user click
      bgVideo.muted = true;
      bgVideo.play().catch(function(){});
    });
  }
}

// Attempt immediate sound on open
tryDirectSoundOnOpen();
document.addEventListener('DOMContentLoaded', tryDirectSoundOnOpen);
window.addEventListener('load', tryDirectSoundOnOpen);

// User click or enter trigger: instantly unmutes and blasts sound!
function handleUserEnter(){
  unmuteAndPlaySound();
  hideLoader();
}
if(loader){
  loader.addEventListener('click', handleUserEnter);
}
window.addEventListener('click', function(){
  if(!isPlaying){
    unmuteAndPlaySound();
  }
});
window.addEventListener('touchstart', function(){
  if(!isPlaying){
    unmuteAndPlaySound();
  }
});
window.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'Enter'){
    handleUserEnter();
  }
});

/* ==================== MODERN RAZOR CURSOR ==================== */
const cursorPointer = document.getElementById('cursorPointer');
const follower = document.getElementById('cursorFollower');
let mx = -100, my = -100;
let followerX = -100, followerY = -100;
let cursorVisible = false;

document.addEventListener('mousemove', function(e){
  mx = e.clientX;
  my = e.clientY;
  if(!cursorVisible){
    cursorVisible = true;
    if(cursorPointer) cursorPointer.style.opacity = '1';
    if(follower) follower.style.opacity = '1';
  }
  if(cursorPointer){
    cursorPointer.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0)';
  }
});

document.addEventListener('mouseleave', function(){
  cursorVisible = false;
  if(cursorPointer) cursorPointer.style.opacity = '0';
  if(follower) follower.style.opacity = '0';
});

function animateFollower(){
  followerX += (mx - followerX) * 0.18;
  followerY += (my - followerY) * 0.18;
  if(follower){
    follower.style.transform = 'translate3d(' + followerX + 'px,' + followerY + 'px,0) translate(-50%,-50%)';
  }
  requestAnimationFrame(animateFollower);
}
requestAnimationFrame(animateFollower);

/* Click Shockwave & Press Reaction */
document.addEventListener('mousedown', function(e){
  if(follower) follower.classList.add('clicking');
  const rip = document.createElement('div');
  rip.className = 'click-shockwave';
  rip.style.left = e.clientX + 'px';
  rip.style.top = e.clientY + 'px';
  document.body.appendChild(rip);
  setTimeout(function(){ rip.remove(); }, 500);
});
document.addEventListener('mouseup', function(){
  if(follower) follower.classList.remove('clicking');
});

/* Delegated Interactive Hover */
const interactiveTargetSelector = 'a, button, .profile-entry, .sound-btn, input, .badge-pill, .music-card, .vid-btn, .social-pure-btn, .profile-location, #loader, .card-toggle, .music-disc-wrapper, .modal-close, .modal-send, [role="button"]';
document.addEventListener('mouseover', function(e){
  if(e.target && e.target.closest && e.target.closest(interactiveTargetSelector)){
    if(cursorPointer) cursorPointer.classList.add('hover');
    if(follower) follower.classList.add('hover');
  }
});
document.addEventListener('mouseout', function(e){
  if(e.target && e.target.closest && e.target.closest(interactiveTargetSelector)){
    if(cursorPointer) cursorPointer.classList.remove('hover');
    if(follower) follower.classList.remove('hover');
  }
});

/* ==================== SPOTLIGHT ==================== */
const spotlight=document.getElementById('spotlight');
document.addEventListener('mousemove',function(e){
  spotlight.style.left=e.clientX+'px';
  spotlight.style.top=e.clientY+'px';
  spotlight.style.opacity='1';
});
document.addEventListener('mouseleave',function(){spotlight.style.opacity='0'});

/* ==================== PARTICLES WITH FLUID REPULSION ==================== */
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createParticles(count){
  particles = [];
  for(let i = 0; i < count; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      size: Math.random() * 2 + 0.6,
      opacity: Math.random() * 0.5 + 0.15,
      life: Math.random() * Math.PI * 2
    });
  }
}
createParticles(75);

function drawParticles(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const repulseRadius = 110;

  for(let i = 0; i < particles.length; i++){
    const p = particles[i];

    // Smooth cursor repulsion
    const dx = p.x - mx;
    const dy = p.y - my;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if(dist < repulseRadius && dist > 0){
      const force = (1 - dist / repulseRadius) * 3;
      p.x += (dx / dist) * force;
      p.y += (dy / dist) * force;
    }

    p.x += p.vx;
    p.y += p.vy;
    p.life += 0.01;

    if(p.x < -10) p.x = canvas.width + 10;
    if(p.x > canvas.width + 10) p.x = -10;
    if(p.y < -10) p.y = canvas.height + 10;
    if(p.y > canvas.height + 10) p.y = -10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + (p.opacity * (0.6 + 0.4 * Math.sin(p.life))).toFixed(3) + ')';
    ctx.fill();

    // Constellation connecting lines
    for(let j = i + 1; j < particles.length; j++){
      const p2 = particles[j];
      const ldx = p.x - p2.x;
      const ldy = p.y - p2.y;
      const ldist = Math.sqrt(ldx * ldx + ldy * ldy);
      if(ldist < 65){
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,' + ((1 - ldist / 65) * 0.07).toFixed(3) + ')';
        ctx.lineWidth = 0.5;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* ==================== LIVE CLOCK (INDIAN STANDARD TIME - 12-HR FORMAT) ==================== */
function updateClock(){
  const clockEl = document.getElementById('miniClock');
  if(!clockEl) return;
  try {
    const formatted = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Kolkata',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    }).format(new Date());
    clockEl.textContent = formatted.replace(/\u202f/g, ' ');
  } catch(e) {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const ist = new Date(utc + (3600000 * 5.5));
    let hours = ist.getHours();
    const minutes = String(ist.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    clockEl.textContent = String(hours).padStart(2, '0') + ':' + minutes + ' ' + ampm;
  }
}
updateClock();
setInterval(updateClock, 1000);

/* ==================== CARD MINIMIZE/MAXIMIZE & PHYSICS LERP ==================== */
const cardToggle = document.getElementById('cardToggle');
const card = document.querySelector('.glass-card');
let cardMinimized = false;

if(cardToggle && card){
  cardToggle.addEventListener('click', function(e){
    e.stopPropagation();
    cardMinimized = !cardMinimized;
    card.classList.toggle('minimized', cardMinimized);
    if(cardMinimized){
      card.style.transform = 'none';
    }
  });

  card.addEventListener('click', function(){
    if(cardMinimized){
      cardMinimized = false;
      card.classList.remove('minimized');
    }
  });
}

// 3D Physics Inertial LERP Engine
let curRotX = 0, curRotY = 0, curTransX = 0, curTransY = 0;
let targetRotX = 0, targetRotY = 0, targetTransX = 0, targetTransY = 0;
let curGlareOpacity = 0, targetGlareOpacity = 0;
let glareX = 50, glareY = 50;

if(card){
  document.addEventListener('mousemove', function(e){
    if(cardMinimized) return;
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) / (window.innerWidth * 0.5);
    const dy = (e.clientY - cy) / (window.innerHeight * 0.5);

    targetRotX = -dy * 11;
    targetRotY = dx * 11;
    targetTransX = dx * 9;
    targetTransY = dy * 9;

    // Specular glare coords on card surface
    const localX = ((e.clientX - rect.left) / rect.width) * 100;
    const localY = ((e.clientY - rect.top) / rect.height) * 100;
    glareX = Math.max(0, Math.min(100, localX));
    glareY = Math.max(0, Math.min(100, localY));

    const isHovering = (
      e.clientX >= rect.left - 40 && e.clientX <= rect.right + 40 &&
      e.clientY >= rect.top - 40 && e.clientY <= rect.bottom + 40
    );
    targetGlareOpacity = isHovering ? 1 : 0.2;
  });

  document.addEventListener('mouseleave', function(){
    targetRotX = 0;
    targetRotY = 0;
    targetTransX = 0;
    targetTransY = 0;
    targetGlareOpacity = 0;
  });

  function updateCardPhysics(){
    if(card && !cardMinimized){
      curRotX += (targetRotX - curRotX) * 0.075;
      curRotY += (targetRotY - curRotY) * 0.075;
      curTransX += (targetTransX - curTransX) * 0.075;
      curTransY += (targetTransY - curTransY) * 0.075;
      curGlareOpacity += (targetGlareOpacity - curGlareOpacity) * 0.08;

      card.style.transform = 'perspective(1000px) translate3d(' + curTransX.toFixed(2) + 'px, ' + curTransY.toFixed(2) + 'px, 0) rotateX(' + curRotX.toFixed(2) + 'deg) rotateY(' + curRotY.toFixed(2) + 'deg)';
      card.style.setProperty('--glare-x', glareX.toFixed(1) + '%');
      card.style.setProperty('--glare-y', glareY.toFixed(1) + '%');
      card.style.setProperty('--glare-opacity', curGlareOpacity.toFixed(3));
    }
    requestAnimationFrame(updateCardPhysics);
  }
  updateCardPhysics();
}

/* ==================== VIDEO SWITCHER & TRACKS ==================== */
const remoteVideos = [
  'https://file.garden/ameA3cFLEklTDhiW/1.mp4',

  'https://file.garden/ameA3cFLEklTDhiW/3.mp4',

];
const localVideos = ['1.mp4', '2.mp4', '3.mp4', '4.mp4'];
const isLocal = window.location.protocol === 'file:';
const videos = isLocal ? localVideos : remoteVideos;

const videoTracks = [
  { title: "Devil 👑 KING // GOAT", artist: "DEVIL" },
  { title: "Devil in the Dark // Phonk", artist: "Interworld" },
  { title: "Judas Slowed // Blood Edit", artist: "Lady Gaga" },
  { title: "Metamorphosis // Nightcore", artist: "Phonkvibe" }
];
let currentVideo = 0;
const vidCounter = document.getElementById('vidCounter');
const trackTitleEl = document.getElementById('trackTitle');

function updateVideoUI(){
  if(vidCounter){
    vidCounter.textContent = String(currentVideo + 1).padStart(2, '0') + ' / ' + String(videos.length).padStart(2, '0');
  }
  if(trackTitleEl && videoTracks[currentVideo]){
    trackTitleEl.textContent = videoTracks[currentVideo].title;
  }
}
updateVideoUI();

function loadVideo(index){
  if(!bgVideo) return;
  const wasPlaying = isPlaying;
  const targetVol = parseFloat(volumeRange ? volumeRange.value : 0.7) || 0.7;

  currentVideo = ((index % videos.length) + videos.length) % videos.length;
  updateVideoUI();

  const nextUrl = videos[currentVideo];

  // Directly set src on video element and child source for 100% browser compliance
  bgVideo.src = nextUrl;
  var source = bgVideo.querySelector('source');
  if(source) source.src = nextUrl;

  // Auto fallback between CDN and local file if network fails
  bgVideo.onerror = function(){
    const alt = isLocal ? remoteVideos[currentVideo] : localVideos[currentVideo];
    if(bgVideo.src !== alt && !bgVideo.src.endsWith('/' + alt)){
      console.warn('Switching to alternate video source:', alt);
      bgVideo.src = alt;
      if(source) source.src = alt;
      bgVideo.load();
      bgVideo.play().catch(function(){});
    }
  };

  bgVideo.load();

  // Play immediately within user click event to preserve gesture token
  bgVideo.muted = !wasPlaying;
  bgVideo.volume = wasPlaying ? targetVol : 0;

  var playPromise = bgVideo.play();
  if(playPromise !== undefined){
    playPromise.then(function(){
      if(wasPlaying){
        bgVideo.muted = false;
        bgVideo.volume = targetVol;
        isPlaying = true;
      }
      bgVideo.style.opacity = '1';
      updateMusicPlayerState();
    }).catch(function(err){
      console.warn('Direct play restricted, falling back to muted play:', err);
      bgVideo.muted = true;
      bgVideo.play().then(function(){
        if(wasPlaying){
          bgVideo.muted = false;
          bgVideo.volume = targetVol;
          isPlaying = true;
        }
        bgVideo.style.opacity = '1';
        updateMusicPlayerState();
      }).catch(function(){
        bgVideo.style.opacity = '1';
      });
    });
  }
}
const prevVidBtn = document.getElementById('prevVideo');
const nextVidBtn = document.getElementById('nextVideo');
if(prevVidBtn) prevVidBtn.addEventListener('click', function(e){ e.stopPropagation(); loadVideo(currentVideo - 1); });
if(nextVidBtn) nextVidBtn.addEventListener('click', function(e){ e.stopPropagation(); loadVideo(currentVideo + 1); });

/* ==================== NOW PLAYING MINI-PLAYER & AUDIO ==================== */
const musicDisc = document.getElementById('musicDisc');
const musicBars = document.querySelector('.music-bars');
const miniPlayBtn = document.getElementById('miniPlayBtn');
const miniPlayIcon = document.getElementById('miniPlayIcon');
const progressWrap = document.getElementById('progressWrap');
const musicBar = document.getElementById('musicBar');
const currTimeEl = document.getElementById('currTime');
const durTimeEl = document.getElementById('durTime');

function formatTime(sec){
  if(isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function updateMusicPlayerState(){
  const active = isPlaying && bgVideo && !bgVideo.paused && !bgVideo.muted;
  if(active){
    if(musicDisc) musicDisc.classList.add('spinning');
    if(musicBars) musicBars.classList.add('active');
    if(miniPlayIcon) miniPlayIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  }else{
    if(musicDisc) musicDisc.classList.remove('spinning');
    if(musicBars) musicBars.classList.remove('active');
    if(miniPlayIcon) miniPlayIcon.innerHTML = '<polygon points="6 4 18 12 6 20 6 4"/>';
  }
}

if(bgVideo){
  bgVideo.addEventListener('timeupdate', function(){
    if(!bgVideo.duration) return;
    const pct = (bgVideo.currentTime / bgVideo.duration) * 100;
    if(musicBar) musicBar.style.width = pct + '%';
    if(currTimeEl) currTimeEl.textContent = formatTime(bgVideo.currentTime);
    if(durTimeEl) durTimeEl.textContent = formatTime(bgVideo.duration);
  });
  bgVideo.addEventListener('play', updateMusicPlayerState);
  bgVideo.addEventListener('pause', updateMusicPlayerState);
  bgVideo.addEventListener('volumechange', updateMusicPlayerState);
}

if(progressWrap && bgVideo){
  progressWrap.addEventListener('click', function(e){
    e.stopPropagation();
    const rect = progressWrap.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    if(bgVideo.duration){
      bgVideo.currentTime = Math.max(0, Math.min(bgVideo.duration, pos * bgVideo.duration));
    }
  });
}

if(miniPlayBtn){
  miniPlayBtn.addEventListener('click', function(e){
    e.stopPropagation();
    toggleSound();
  });
}

/* ==================== VIDEO AUDIO & EQUALIZER ==================== */
function createVisualizerBars(){
  if(!visualizer) return;
  visualizer.innerHTML = '';
  for(let i = 0; i < 48; i++){
    const bar = document.createElement('div');
    bar.className = 'bar';
    visualizer.appendChild(bar);
  }
}
createVisualizerBars();

function toggleSound(force){
  if(!bgVideo) return;
  if(force === true || !isPlaying){
    bgVideo.muted = false;
    bgVideo.volume = parseFloat(volumeRange ? volumeRange.value : 0.7) || 0.7;
    isPlaying = true;
    if(soundBtn) soundBtn.style.opacity = '1';
  }else{
    bgVideo.muted = true;
    bgVideo.volume = 0;
    isPlaying = false;
    if(soundBtn) soundBtn.style.opacity = '0.5';
    if(visualizer){
      document.querySelectorAll('.visualizer-container .bar').forEach(function(b){ b.style.height = '0'; });
    }
  }
  updateSoundIcon();
  updateMusicPlayerState();
}

// Dynamic equalizer bar animation when audio plays
function animateVisualizer(){
  if(visualizer){
    const bars = visualizer.children;
    if(isPlaying && bgVideo && !bgVideo.paused && !bgVideo.muted){
      const t = Date.now() * 0.009;
      for(let i = 0; i < bars.length; i++){
        const h = Math.abs(Math.sin(t + i * 0.4)) * 14 + (Math.random() * 10) + 3;
        bars[i].style.height = h + 'px';
      }
    }else{
      for(let i = 0; i < bars.length; i++){
        bars[i].style.height = '0px';
      }
    }
  }
  requestAnimationFrame(animateVisualizer);
}
animateVisualizer();

if(soundBtn){
  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    toggleSound();
  });
  soundBtn.addEventListener('mouseenter', function(){

if(volumeSlider){

document.addEventListener('click', function(e){

    if(volumeSlider) volumeSlider.classList.remove('visible');

});

if(volumeRange){
  volumeRange.addEventListener('input', function(){
    if(!bgVideo) return;
    bgVideo.volume = parseFloat(this.value);
    if(parseFloat(this.value) > 0 && !isPlaying){

}
