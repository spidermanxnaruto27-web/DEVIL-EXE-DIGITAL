<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL EXE — Digital Space</title>
<meta name="description" content="Welcome to my digital space. Connect with me on Discord and Instagram.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --glass-bg:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.08);
  --glass-shadow:rgba(0,0,0,0.8);
  --text-primary:#ffffff;
  --text-secondary:rgba(255,255,255,0.5);
  --text-muted:rgba(255,255,255,0.25);
  --accent:#ffffff;
  --blur-amount:40px;
  --radius:28px;
  --radius-sm:16px;
  --transition:0.6s cubic-bezier(0.22,1,0.36,1);
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:'Inter','SF Pro Display','Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#000;
  color:var(--text-primary);
  overflow-x:hidden;
  cursor:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
::selection{background:rgba(255,255,255,0.2);color:#fff}

/* Loading Screen */
#loader{
  position:fixed;inset:0;z-index:99999;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.8s ease,visibility 0.8s ease;
}
#loader.hidden{opacity:0;visibility:hidden}
.loader-ring{width:64px;height:64px;position:relative}
.loader-ring div{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;
  border-top-color:rgba(255,255,255,0.6);
  animation:spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
}
.loader-ring div:nth-child(2){
  inset:6px;border-top-color:rgba(255,255,255,0.3);
  animation-direction:reverse;animation-duration:0.8s;
}
.loader-ring div:nth-child(3){
  inset:12px;border-top-color:rgba(255,255,255,0.15);
  animation-duration:1.6s;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-top:28px;font-weight:300}

/* Video Background */
.video-container{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;
  background:#000;
}
.video-container video{
  position:absolute;min-width:100%;min-height:100%;
  width:100%;height:100%;
  object-fit:cover;
  will-change:transform;
  transition:opacity 0.4s ease;
}
.video-overlay{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,0,0,0.7) 0%,rgba(0,0,0,0.3) 50%,rgba(0,0,0,0.7) 100%);
  z-index:1;
}
.grain-overlay{
  position:fixed;inset:0;z-index:2;
  opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  pointer-events:none;
}

/* Particles Canvas */
#particles-canvas{position:fixed;inset:0;z-index:3;pointer-events:none}

/* Cursor */
.cursor-dot{
  position:fixed;width:8px;height:8px;border-radius:50%;
  background:#fff;z-index:99998;pointer-events:none;
  mix-blend-mode:difference;
  transition:transform 0.1s ease;
  will-change:transform;
}
.cursor-ring{
  position:fixed;width:40px;height:40px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.3);z-index:99997;pointer-events:none;
  transition:width 0.3s,height 0.3s,background 0.3s;
  will-change:transform;
}
.cursor-ring.hover{width:64px;height:64px;background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.5)}

/* Spotlight */
.spotlight{
  position:fixed;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 70%);
  pointer-events:none;z-index:4;
  transform:translate(-50%,-50%);
  will-change:transform,opacity;
  opacity:0;
  transition:opacity 0.8s ease;
}

/* Music Visualizer */
.visualizer-container{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;align-items:flex-end;gap:3px;
  height:32px;opacity:0.4;
  pointer-events:none;
}
.visualizer-container .bar{
  width:3px;border-radius:2px;
  background:linear-gradient(to top,transparent,rgba(255,255,255,0.6));
  transition:height 0.08s ease;
  will-change:height;
}

/* Sound Button */
.sound-btn{
  position:fixed;bottom:32px;right:32px;z-index:50;
  width:48px;height:48px;border-radius:50%;
  background:var(--glass-bg);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;cursor:none;
  transition:all var(--transition);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.sound-btn:hover{
  background:rgba(255,255,255,0.1);
  transform:scale(1.08);
  border-color:rgba(255,255,255,0.2);
}
.volume-slider-container{
  position:fixed;bottom:92px;right:32px;z-index:50;
  opacity:0;visibility:hidden;
  transition:all var(--transition);
  transform:translateY(8px);
}
.volume-slider-container.visible{opacity:1;visibility:visible;transform:translateY(0)}
.volume-slider-container input[type="range"]{
  -webkit-appearance:none;appearance:none;
  width:120px;height:3px;border-radius:2px;
  background:rgba(255,255,255,0.15);
  outline:none;display:block;
  cursor:none;
}
.volume-slider-container input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #000;
  cursor:none;
}
.volume-slider-container input[type="range"]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #000;cursor:none;
}

/* Navigation */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:20px 48px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,transparent 100%);
  opacity:0;transform:translateY(-20px);
  animation:navFadeIn 1s ease 0.8s forwards;
}
@keyframes navFadeIn{to{opacity:1;transform:translateY(0)}}
.nav-logo{
  font-size:14px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:#fff;text-decoration:none;
  text-shadow:0 0 20px rgba(255,255,255,0.15),0 0 60px rgba(255,255,255,0.05);
  animation:logoGlow 3s ease-in-out infinite;
}
@keyframes logoGlow{0%,100%{text-shadow:0 0 20px rgba(255,255,255,0.15),0 0 60px rgba(255,255,255,0.05)}50%{text-shadow:0 0 30px rgba(255,255,255,0.3),0 0 80px rgba(255,255,255,0.08),0 0 120px rgba(255,255,255,0.03)}}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{
  color:var(--text-secondary);text-decoration:none;
  font-size:13px;font-weight:400;letter-spacing:1.5px;text-transform:uppercase;
  position:relative;padding:4px 0;
  transition:color var(--transition);
  cursor:none;
}
.nav-links a::after{
  content:'';position:absolute;bottom:0;left:0;width:0;height:1px;
  background:#fff;transition:width var(--transition);
}
.nav-links a:hover{color:#fff}
.nav-links a:hover::after{width:100%}

/* Hero Section */
.hero{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:120px 24px 80px;
  text-align:center;
}
.hero::before{
  content:'';position:absolute;top:50%;left:50%;width:60vmin;height:60vmin;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,0.015) 0%,transparent 70%);
  pointer-events:none;z-index:-1;
}

/* Card Ring Glow */
.card-ring{
  position:absolute;top:50%;left:50%;width:120%;height:120%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,transparent 60%);
  animation:ringPulse 4s ease-in-out infinite;
}
@keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6}50%{transform:translate(-50%,-50%) scale(1.08);opacity:1}}

/* Glass Card */
.glass-card{
  width:100%;max-width:520px;
  padding:44px 36px 36px;
  background:rgba(8,8,12,0.5);
  backdrop-filter:blur(32px);
  -webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);
  box-shadow:0 32px 120px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);
  position:relative;
  opacity:0;filter:blur(6px);
  animation:cardReveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
}
@keyframes cardReveal{to{opacity:1;filter:blur(0)}}
.glass-card::before{
  content:'';position:absolute;inset:-1px;border-radius:calc(var(--radius)+1px);
  background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,transparent 50%,rgba(255,255,255,0.02) 70%,transparent 100%);
  pointer-events:none;z-index:-1;
}
.glass-card::after{
  content:'';position:absolute;inset:0;border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(255,255,255,0.03) 0%,transparent 50%);
  pointer-events:none;z-index:-1;
}

/* Empty state for deleted elements */

/* Mini Elements */
.mini-clock{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:50;
  font-size:13px;font-weight:300;letter-spacing:4px;color:rgba(255,255,255,0.25);
  font-variant-numeric:tabular-nums;pointer-events:none;
  opacity:0;animation:fadeIn 1s ease 1.5s forwards;
}
@keyframes fadeIn{to{opacity:1}}

.mini-status{
  position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,0.15);text-transform:uppercase;
  opacity:0;animation:fadeIn 1s ease 1.8s forwards;pointer-events:none;
}
.mini-status .dot{
  width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.3);
  animation:blink 2s ease infinite;
}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}

@media(max-width:768px){
  .mini-clock{font-size:11px;letter-spacing:2px;top:60px}
  .mini-status{top:80px}
}

/* Card Toggle */
.card-toggle{
  position:absolute;top:16px;right:16px;z-index:5;
  width:32px;height:32px;border-radius:8px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.3);
  display:flex;align-items:center;justify-content:center;
  cursor:none;transition:all var(--transition);
}
.card-toggle:hover{
  background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.6);
  border-color:rgba(255,255,255,0.08);
}
.card-toggle svg{transition:transform 0.4s ease}
.glass-card.minimized .card-toggle svg{transform:rotate(45deg)}
.glass-card.minimized .profile-entries{display:none}
.glass-card.minimized{max-width:180px;padding:16px 20px;cursor:pointer;overflow:hidden;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:rgba(255,255,255,0.03);box-shadow:none}
.glass-card.minimized .card-ring{opacity:0}
.glass-card.minimized .card-toggle{top:50%;right:10px;transform:translateY(-50%)}
.glass-card.minimized::before,.glass-card.minimized::after{display:none}

.mini-brand{
  font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,0.5);text-align:center;
  display:none;
}
.glass-card.minimized .mini-brand{
  display:block;
  color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,0.25),0 0 60px rgba(255,255,255,0.1),0 0 100px rgba(255,255,255,0.05);
  animation:minBrandGlow 3s ease-in-out infinite;
}
@keyframes minBrandGlow{0%,100%{text-shadow:0 0 20px rgba(255,255,255,0.25),0 0 60px rgba(255,255,255,0.1)}50%{text-shadow:0 0 40px rgba(255,255,255,0.5),0 0 80px rgba(255,255,255,0.2),0 0 120px rgba(255,255,255,0.08)}}

/* Profile Entries */
.profile-entries{display:flex;flex-direction:column;gap:10px;margin-bottom:0}
.profile-entry .label{text-shadow:0 0 10px rgba(255,255,255,0.06)}
.profile-entry .value{text-shadow:0 0 8px rgba(255,255,255,0.08)}
.profile-entry{
  display:flex;align-items:center;gap:14px;
  padding:10px 14px;
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.04);
  transition:all var(--transition);
  text-align:left;position:relative;overflow:hidden;
}
.profile-entry::before{
  content:'';position:absolute;inset:0;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,rgba(255,255,255,0.04),transparent 60%);
  opacity:0;transition:opacity var(--transition);
}
.profile-entry:hover{
  background:rgba(255,255,255,0.05);
  border-color:rgba(255,255,255,0.08);
  transform:scale(1.02);
}
.profile-entry:hover::before{opacity:1}
.profile-entry .icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:17px;
  background:transparent;
  border:1px solid rgba(255,255,255,0.04);
  transition:all var(--transition);
}
.profile-entry:hover .icon{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.08);transform:scale(1.05)}
.profile-entry .info{flex:1;display:flex;flex-direction:column;justify-content:center}
.profile-entry .label{font-size:9px;text-transform:uppercase;letter-spacing:1.6px;color:var(--text-muted);font-weight:400;line-height:1}
.profile-entry .value{font-size:15px;font-weight:600;color:#fff;letter-spacing:-0.01em;line-height:1.3}
.profile-entry .badge-new{
  font-size:8px;text-transform:uppercase;letter-spacing:1.2px;
  padding:3px 8px;border-radius:5px;
  background:transparent;
  color:var(--text-muted);font-weight:400;
  align-self:center;margin-left:auto;
}

/* Buttons */
/* Floating Side Buttons */
.side-buttons{
  position:fixed;left:32px;bottom:32px;z-index:50;
  display:flex;flex-direction:column;gap:10px;
}
.side-btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:12px 20px;border-radius:12px;
  font-family:inherit;font-size:13px;font-weight:500;
  letter-spacing:0.2px;text-decoration:none;
  transition:all var(--transition);
  border:1px solid rgba(255,255,255,0.06);
  cursor:none;position:relative;overflow:hidden;
  background:rgba(255,255,255,0.04);
  color:#fff;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
  width:fit-content;
}
.side-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent);
  opacity:0;transition:opacity var(--transition);
}
.side-btn:hover::before{opacity:1}
.side-btn:hover{
  transform:translateX(4px);
  border-color:rgba(255,255,255,0.1);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.side-btn:active{transform:translateX(2px) scale(0.98)}
.side-btn .icon{width:16px;height:16px;flex-shrink:0}

@media(max-width:768px){
  .side-buttons{left:20px;bottom:80px}
  .side-btn{padding:10px 16px;font-size:12px}
}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);
  z-index:200;padding:12px 24px;border-radius:12px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff;font-size:13px;font-weight:400;
  opacity:0;transition:all 0.4s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Footer */
footer{
  position:relative;z-index:10;
  text-align:center;padding:32px 24px;
  font-size:12px;color:var(--text-muted);letter-spacing:0.5px;
  font-weight:300;
}

/* Responsive */
@media(max-width:900px){
  body{cursor:auto}
  .cursor-dot,.cursor-ring,.spotlight{display:none}
  .mini-corner.tl{left:20px}
  .mini-corner.tr{right:20px}
}
@media(max-width:768px){
  nav{padding:14px 20px}
  .nav-links{gap:14px}
  .nav-links a{font-size:10px;letter-spacing:1px}
  .glass-card{max-width:92vw;padding:28px 20px 24px;margin:0 auto;border-radius:20px}
  .profile-entry{padding:10px 14px;gap:12px}
  .profile-entry .value{font-size:13px}
  .profile-entry .icon{width:34px;height:34px;font-size:15px}
  .profile-entries{gap:10px;margin-bottom:24px}
  .sound-btn{right:16px;bottom:80px;width:40px;height:40px;font-size:14px}
  .volume-slider-container{right:16px;bottom:130px}
  .volume-slider-container input[type="range"]{width:100px}
  .video-switcher{bottom:80px;gap:8px}
  .vid-btn{width:36px;height:36px;font-size:14px}
  .side-buttons{left:16px;bottom:80px;gap:6px}
  .side-btn{padding:8px 14px;font-size:11px;border-radius:10px}
  .side-btn .icon{width:14px;height:14px}
  .hero{padding:100px 16px 60px}
  footer{padding:24px 16px;font-size:10px}
  .toast{bottom:140px;font-size:12px;padding:10px 18px}
  .mini-clock{font-size:11px;top:56px}
  .mini-status{top:76px;font-size:9px}
  .glass-card.minimized{max-width:140px;padding:12px 16px}
  .card-toggle{width:28px;height:28px}
  .mini-brand{font-size:11px;letter-spacing:2px}
}
@media(max-width:480px){
  nav{padding:12px 16px}
  .nav-links{gap:10px}
  .nav-links a{font-size:9px;letter-spacing:0.5px}
  .nav-logo{font-size:11px;letter-spacing:2px}
  .glass-card{max-width:96vw;padding:24px 16px 20px;border-radius:20px}
  .profile-entry{padding:8px 12px;gap:10px}
  .profile-entry .value{font-size:12px}
  .profile-entry .label{font-size:9px}
  .profile-entry .icon{width:30px;height:30px;font-size:13px}
  .profile-entries{gap:8px;margin-bottom:20px}
  .side-buttons{left:12px;bottom:70px;gap:4px}
  .side-btn{padding:6px 12px;font-size:10px;border-radius:8px}
  .sound-btn{right:12px;bottom:70px;width:36px;height:36px;font-size:12px}
  .video-switcher{bottom:70px;gap:6px}
  .vid-btn{width:32px;height:32px;font-size:12px}
  .hero{padding:80px 12px 50px}
  .toast{bottom:120px;font-size:11px;padding:8px 14px}
  .mini-clock{font-size:10px;top:52px;letter-spacing:2px}
  .mini-status{top:70px;font-size:8px}

  .glass-card.minimized{max-width:120px;padding:10px 14px}
  .mini-brand{font-size:10px;letter-spacing:1.5px}
}

/* Video Switcher */
.video-switcher{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:12px}
.vid-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:none;transition:all var(--transition);
  font-size:16px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.vid-btn:hover{background:rgba(255,255,255,0.12);transform:scale(1.1);border-color:rgba(255,255,255,0.2)}

@media(max-width:768px){
  .video-switcher{bottom:80px}
}

/* Animations */
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.glow-border{position:relative}
.glow-border::before{
  content:'';position:absolute;inset:-1px;border-radius:calc(var(--radius)+1px);
  background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent 50%,rgba(255,255,255,0.02));
  z-index:-1;opacity:0.4;
  animation:borderGlow 4s ease-in-out infinite;
}
@keyframes borderGlow{0%,100%{opacity:0.4}50%{opacity:0.1}}

/* Contact Modal */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:all 0.5s ease;
}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-card{
  width:100%;max-width:400px;padding:40px 32px 32px;
  background:rgba(10,10,14,0.6);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:24px;position:relative;
  transform:scale(0.9) translateY(20px);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);
}
.modal-overlay.show .modal-card{transform:scale(1) translateY(0)}
.modal-close{
  position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;
  background:transparent;border:1px solid rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;
  cursor:none;transition:all var(--transition);
}
.modal-close:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6)}
.modal-body,.modal-success{transition:all 0.4s ease}
.modal-success{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;border-radius:24px}
.modal-success.show{opacity:1;visibility:visible}
.modal-body.hidden{opacity:0;visibility:hidden}
.modal-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:4px}
.modal-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:24px;letter-spacing:-0.02em}
.modal-inputs{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.modal-input{
  width:100%;padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);
  color:#fff;font-family:inherit;font-size:13px;outline:none;
  transition:all var(--transition);resize:none;
}
.modal-input:focus{border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.05)}
.modal-input::placeholder{color:rgba(255,255,255,0.2)}
.modal-textarea{min-height:80px}
.modal-send{
  width:100%;padding:12px;border-radius:12px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  color:#fff;font-family:inherit;font-size:13px;font-weight:500;
  cursor:none;transition:all var(--transition);
}
.modal-send:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.12)}
.modal-send:active{transform:scale(0.98)}
.success-ring{
  width:56px;height:56px;border-radius:50%;
  background:rgba(255,255,255,0.06);
  border:2px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;animation:successPop 0.5s cubic-bezier(0.16,1,0.3,1);
}
@keyframes successPop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.success-check{width:24px;height:24px;color:rgba(255,255,255,0.8)}
.success-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:6px}
.success-sub{font-size:12px;color:var(--text-muted);text-align:center;max-width:240px;line-height:1.5}
.success-ring::after{
  content:'';position:absolute;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,0.04),transparent 70%);
  animation:successGlow 2s ease-in-out infinite;
}
@keyframes successGlow{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.15);opacity:1}}

}

<script>
(function(){
'use strict';

/* ==================== LOADER ==================== */
window.addEventListener('load',function(){
  bgVideo.play().then(function(){
    document.getElementById('loader').classList.add('hidden');
    document.body.style.cursor = 'none';
  }).catch(function(){
    document.getElementById('loader').classList.add('hidden');
    document.body.style.cursor = 'none';
  });
  setTimeout(function(){
    if(!document.getElementById('loader').classList.contains('hidden')){
      document.getElementById('loader').classList.add('hidden');
      document.body.style.cursor = 'none';
    }
  },4000);
});

/* ==================== CURSOR ==================== */
const dot=document.getElementById('cursorDot');
const ring=document.getElementById('cursorRing');
let mx=0,my=0,ringX=0,ringY=0;
document.addEventListener('mousemove',function(e){
  mx=e.clientX;my=e.clientY;
  dot.style.left=mx+'px';dot.style.top=my+'px';
});
function animateCursor(){
  ringX+=(mx-ringX)*0.12;
  ringY+=(my-ringY)*0.12;
  ring.style.left=ringX+'px';ring.style.top=ringY+'px';
  requestAnimationFrame(animateCursor);
}
animateCursor();
document.querySelectorAll('a,button,.profile-entry,.sound-btn, input[type="range"]').forEach(function(el){
  el.addEventListener('mouseenter',function(){ring.classList.add('hover')});
  el.addEventListener('mouseleave',function(){ring.classList.remove('hover')});
});

/* ==================== SPOTLIGHT ==================== */
const spotlight=document.getElementById('spotlight');
document.addEventListener('mousemove',function(e){
  spotlight.style.left=e.clientX+'px';
  spotlight.style.top=e.clientY+'px';
  spotlight.style.opacity='1';
});
document.addEventListener('mouseleave',function(){spotlight.style.opacity='0'});

/* ==================== PARTICLES ==================== */
const canvas=document.getElementById('particles-canvas');
const ctx=canvas.getContext('2d');
let particles=[];
let animId;

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function createParticles(count){
  particles=[];
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      size:Math.random()*2+0.5,
      speedX:(Math.random()-0.5)*0.3,
      speedY:(Math.random()-0.5)*0.3,
      opacity:Math.random()*0.5+0.1,
      life:Math.random()*Math.PI*2
    });
  }
}
createParticles(80);

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    p.x+=p.speedX;
    p.y+=p.speedY;
    p.life+=0.008;
    if(p.x<0||p.x>canvas.width) p.speedX*=-1;
    if(p.y<0||p.y>canvas.height) p.speedY*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+(p.opacity*(0.6+0.4*Math.sin(p.life)))+')';
    ctx.fill();
  }
  animId=requestAnimationFrame(drawParticles);
}
drawParticles();

/* ==================== LIVE CLOCK ==================== */
function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('miniClock').textContent=h+':'+m;
}
updateClock();
setInterval(updateClock,1000);

/* ==================== CARD MINIMIZE/MAXIMIZE ==================== */
const cardToggle=document.getElementById('cardToggle');
const glassCard=document.querySelector('.glass-card');
let cardMinimized=false;
cardToggle.addEventListener('click',function(e){
  e.stopPropagation();
  cardMinimized=!cardMinimized;
  glassCard.classList.toggle('minimized',cardMinimized);
});
glassCard.addEventListener('click',function(){
  if(cardMinimized){
    cardMinimized=false;
    glassCard.classList.remove('minimized');
  }
});

/* ==================== MOUSE PARALLAX ON CARD ==================== */
const card=document.querySelector('.glass-card');
if(card){
  document.addEventListener('mousemove',function(e){
    if(cardMinimized) return;
    const rect=card.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    const dx=(e.clientX-cx)/rect.width;
    const dy=(e.clientY-cy)/rect.height;
    card.style.transform='translate('+(dx*6)+'px,'+(dy*6)+'px) rotateX('+(-dy*3)+'deg) rotateY('+(dx*3)+'deg)';
  });
  document.addEventListener('mouseleave',function(){
    card.style.transform='translate(0,0) rotateX(0) rotateY(0)';
  });
}

/* ==================== VIDEO SWITCHER ==================== */
const videos=[
  'https://file.garden/ameA3cFLEklTDhiW/3.mp4',
  'https://file.garden/ameA3cFLEklTDhiW/2.mp4',
  'https://file.garden/ameA3cFLEklTDhiW/fight.mp4',
  'https://file.garden/ameA3cFLEklTDhiW/4.mp4'
];
let currentVideo=0;
const bgVideo=document.getElementById('bgVideo');
function loadVideo(index){
  const wasPlaying=isPlaying;
  const vol=bgVideo.volume;
  bgVideo.style.opacity='0';
  setTimeout(function(){
    currentVideo=((index%videos.length)+videos.length)%videos.length;
    var source=bgVideo.querySelector('source');
    source.src=videos[currentVideo];
    bgVideo.load();
    bgVideo.play().then(function(){
      bgVideo.volume=wasPlaying?vol:0;
      bgVideo.style.opacity='1';
    }).catch(function(){
      bgVideo.style.opacity='1';
    });
  },300);
}
document.getElementById('prevVideo').addEventListener('click',function(){loadVideo(currentVideo-1)});
document.getElementById('nextVideo').addEventListener('click',function(){loadVideo(currentVideo+1)});

/* ==================== VIDEO AUDIO ==================== */
const soundBtn=document.getElementById('soundBtn');
const volumeRange=document.getElementById('volumeRange');
const volumeSlider=document.getElementById('volumeSlider');
const visualizer=document.getElementById('visualizer');
let isPlaying=false;

function createVisualizerBars(){
  visualizer.innerHTML='';
  for(let i=0;i<48;i++){
    const bar=document.createElement('div');
    bar.className='bar';
    visualizer.appendChild(bar);
  }
}
createVisualizerBars();

function updateSoundIcon(){
  const icon=document.getElementById('soundIcon');
  if(isPlaying){
    icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
  }else{
    icon.innerHTML='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
  }
}

function toggleSound(force){
  if(force===true||!isPlaying){
    bgVideo.muted=false;
    bgVideo.volume=parseFloat(volumeRange.value);
    isPlaying=true;
    soundBtn.style.opacity='1';
  }else{
    bgVideo.muted=true;
    bgVideo.volume=0;
    isPlaying=false;
    soundBtn.style.opacity='0.5';
    document.querySelectorAll('.visualizer-container .bar').forEach(function(b){b.style.height='0'});
  }
  updateSoundIcon();
}

soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  toggleSound();
});
soundBtn.addEventListener('mouseenter',function(){
  volumeSlider.classList.add('visible');
});
volumeSlider.addEventListener('mouseleave',function(){
  volumeSlider.classList.remove('visible');
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.volume-slider-container')&&!e.target.closest('.sound-btn')){
    volumeSlider.classList.remove('visible');
  }
});

volumeRange.addEventListener('input',function(){
  bgVideo.volume=parseFloat(this.value);
  if(parseFloat(this.value)>0&&!isPlaying){
    isPlaying=true;
    soundBtn.style.opacity='1';
    updateSoundIcon();
  }
  if(parseFloat(this.value)===0){
    isPlaying=false;
    soundBtn.style.opacity='0.5';
    updateSoundIcon();
  }
});

/* ==================== TOAST ==================== */
const toast=document.getElementById('toast');
let toastTimeout;
function showToast(msg){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout=setTimeout(function(){toast.classList.remove('show')},2500);
}

/* ==================== NAV SMOOTH SCROLL ==================== */
document.querySelectorAll('.nav-link').forEach(function(link){
  link.addEventListener('click',function(e){
    e.preventDefault();
    const href=this.getAttribute('href');
    if(href==='#discord'){
      document.getElementById('discord').scrollIntoView({behavior:'smooth',block:'center'});
    }else if(href==='#instagram'){
      document.getElementById('instagram').scrollIntoView({behavior:'smooth',block:'center'});
    }else if(href==='#contact'){
      showContactModal();
    }else{
      window.scrollTo({top:0,behavior:'smooth'});
    }
  });
});

/* ==================== CONTACT MODAL ==================== */
const contactModal=document.getElementById('contactModal');
const modalCard=document.getElementById('modalCard');
const modalBody=document.getElementById('modalBody');
const modalSuccess=document.getElementById('modalSuccess');
const modalClose=document.getElementById('modalClose');
const modalSend=document.getElementById('modalSend');

function showContactModal(){
  contactModal.classList.add('show');
  modalBody.classList.remove('hidden');
  modalSuccess.classList.remove('show');
  document.getElementById('inputName').value='';
  document.getElementById('inputEmail').value='';
  document.getElementById('inputMessage').value='';
}
function hideContactModal(){
  contactModal.classList.remove('show');
}
modalClose.addEventListener('click',hideContactModal);
contactModal.addEventListener('click',function(e){
  if(e.target===contactModal) hideContactModal();
});
modalSend.addEventListener('click',function(){
  const name=document.getElementById('inputName').value.trim();
  const email=document.getElementById('inputEmail').value.trim();
  const msg=document.getElementById('inputMessage').value.trim();
  if(!name||!email||!msg){
    showToast('Please fill all fields');
    return;
  }
  if(!email.includes('@')){
    showToast('Enter a valid email');
    return;
  }
  modalBody.classList.add('hidden');
  modalSuccess.classList.add('show');
  showToast('Message sent successfully!');
  setTimeout(hideContactModal,2500);
});

/* ==================== KEYBOARD SHORTCUT ==================== */
document.addEventListener('keydown',function(e){
  if(e.key==='m'||e.key==='M') toggleSound();
  if(e.key==='Escape') hideContactModal();
});
